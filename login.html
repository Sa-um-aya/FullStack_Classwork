<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      
    }
    .login-wrapper {
   display: flex;
   justify-content: center; 
   align-items: center;     
   min-height: 100vh;       
   background-color: #f5f5f5;
}

    .login-container {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
      text-align: center;
     ;
    }

    .login-container h2 {
      margin-bottom: 20px;
    }

    .login-container input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .login-container button {
      width: 100%;
      padding: 10px;
      background: #007BFF;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .login-container button:hover {
      background: #0056b3;
    }

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

 
.navbar {
  display: flex;                   
  justify-content: space-between;  
  align-items: top;             
  padding: 1rem 2rem;
  background-color: #333;
  color: white;
}


.nav-links {
  display: flex;                 
  list-style: none;               
  gap: 1.5rem;                     
}


.nav-links a {
  color: white;
  text-decoration: none;
  font-size: 1rem;
}

.nav-links a:hover {
  color: #00bcd4;                
} 

  </style>
</head>
<body>
<nav class="navbar">
  <div class="logo">😁Logo😁</div>
  <ul class="nav-links">
    <li><a href="#">Home🏡</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Services</a></li>
    <li><a href="#">Contact📞</a></li>
  </ul>
</nav>
<div class="login-wrapper">
  <div class="login-container">
    <h2>🪵Login🏠</h2>
    <form>
      <input type="text" placeholder="Username" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
  </div>
  </div>
</body>
</html>
