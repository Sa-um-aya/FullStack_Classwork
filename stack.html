<!DOCTYPE html>
<lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --primary-color:blue;
            --secondary-color:red;
            --text-size:30px;
            
        }
        .container{
            display:grid;
            outline:1px solid black;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr 1fr;
            height: 500px;
            width: 500px;
        }
        .parent{
            display:grid;
            grid-template-columns: subgrid;
            grid-template-rows: subgrid;
            grid-column:1/4;
            grid-row:1/4;
            font-size:30px;
            background-color: var(--primary-color);
            color:black;
        }
        .child{
            display:grid;
            grid-template-columns: subgrid;
            grid-template-rows: subgrid;
            grid-column:1/3;
            grid-row:1/3;
            background-color:var(--secondary-color);
            color:black;
        }
        .inner-child{
            display:grid;
            grid-column:1/2;
            grid-row:1/2;
            background-color:yellow ;
            color:black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="parent">
            <div class="child">
                <div class="inner-child">JAI RAM</div>
                 PRABAL PRATAP
            </div>
            KAUSHAL NAATH
        </div>
       GUNGAN GAWAHI
    </div>
</body>
</html>
