<head>

<style>
    li:not(:hover){
        color:yellow;
    }
    button:not(:hover){
        color:magenta;
    }
   /*Property transferred to parent due to child*/ div:has(h2){
        background-color:red;
        color:white;
    }
    /*if either h2 or h3 is present in the class then the property gets applied*/div:is(h2,h3){
        background-color:red;
        color:white;
    }
    div:has(h2,h3){
        box-shadow:0 0 3px;
    }
    #{
        height:30px;
        background-color:aqua;
    }
    .a::before{
        content:"A";
        position:absolute;
        left:0px;
    }
    #a::after{
        content:"B";
        position:absolute;
    }
    </style>
    </head>
    <body>
        <ul>

             <li>2</li>

            <div >
