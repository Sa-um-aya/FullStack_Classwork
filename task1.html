<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Arena</title>
    <style>
body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: var(--bg-light);
    color: var(--text-dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
}


h1 {
    font-size: 1.75rem;
    font-weight: 800;
    margin-bottom: 24px;
    text-align: center;
    color: var(--text-dark);
}


.quiz-card {
    background: var(--card-bg);
    padding: 32px;
    border-radius: 12px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 550px;
    min-height: 320px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}


.meta-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    font-size: 0.95rem;
    font-weight: 600;
    color: #6b7280; 
}

#score {
    background-color: #e0e7ff;
    color: var(--primary);
    padding: 4px 12px;
    border-radius: 20px;
}


#question-text {
    font-size: 1.25rem;
    font-weight: 700;
    line-height: 1.5;
    margin-bottom: 20px;
}


.options-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 24px;
}

.option-btn {
    background-color: var(--card-bg);
    color: var(--text-dark);
    border: 2px solid var(--border-color);
    padding: 14px 20px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s ease;
    width: 100%;
}


.option-btn:hover:not([disabled]) {
    border-color: var(--primary);
    background-color: #f5f3ff;
    transform: translateY(-1px);
}

.option-btn:active:not([disabled]) {
    transform: translateY(0);
}


.option-btn:disabled {
    cursor: not-allowed;
    opacity: 0.7;
}


.next-btn {
    background-color: var(--primary);
    color: white;
    border: none;
    padding: 12px 28px;
    border-radius: 6px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    align-self: flex-end; 
    transition: background-color 0.2s ease;
}

.next-btn:hover {
    background-color: var(--primary-hover);
}


#result-area {
    text-align: center;
    padding: 20px 0;
}

#result-area h2 {
    font-size: 1.75rem;
    color: var(--primary);
    margin-bottom: 12px;
}

#final-score {
    font-size: 1.2rem;
    font-weight: 500;
    color: #4b5563;
}


.hidden {
    display: none !important;
}

    </style>
</head>
<body>
    <h1>😄Quiz Arena -> Questions that mean nothing😄</h1>
    
    <div class="quiz-card">
     
        <div id="quiz-area">
            <div class="meta-info">
                <span id="progress">Q 1/3</span>
                <span id="score">Score: 0</span>
            </div>
            <h3 id="question-text">Question goes here</h3>
            <div id="options-container" class="options-list"></div>
            <button id="next-btn" class="next-btn hidden">Next</button>
        </div>

        
        <div id="result-area" class="hidden">
            <h2>Quiz Finished!</h2>
            <p id="final-score"></p>
        </div>
    </div>

    
    <script src="task1.js"></script> 
</body>
</html>
