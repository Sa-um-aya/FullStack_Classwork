<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Arena</title>
    <style>
        </style>
        </head>
        <body>
    <div class="game-container">
    <h1>Guess the Number!</h1>
    <p>I am thinking of a number between 1 and 100. Can you guess it?</p>
    
    <input type="number" id="guessInput" min="1" max="100" placeholder="1-100">
    <button id="submitBtn">Guess</button>
    
    <div class="message" id="message"></div>
    <button id="resetBtn" style="display: none; margin-top: 20px;">Play Again</button>
</div>
            <script src="guess.js"></script>
            
        </body>
    </html>
