  .container{
    display:flex;

  }
  .box{
    flex:1;
    display:flex;
    align-items:center;

    height:150px;
    width:100px;
    background-color:pink;
    gap:20%;
    padding:25px;

  }
  .box>div{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100px;
    height:80px;
    margin:15px;
    border-radius:8px;
  }
  img{
    width:100%;
    height:100%;
    object-position: cover;
  }
