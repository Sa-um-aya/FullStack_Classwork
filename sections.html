 button:hover{

li:nth-child(-n+2){

input{
    border-width:0px 0px 3px 0px;

    margin-top:3%;

}
input:required{
    border-color:Red;
}
input:optional{

}
input:enabled{
    background-color:transparent;
    box-shadow:0 0 3px black;
}
input:disabled{
    background-color:grey;
    border-width:0px;
}
input:valid{
    background-color:red;
}
input:in-range{
    background-color:aqua;
}
input:out-of-range{
    background-color:pink;}
input:placeholder-shown{
    outline:3px solid blue;
}
input:read-only{
    border-width:0px;
    box-shadow:0 0 0 transparent;
    background:grey;
    color:white;
}
input:focus{
    box-shadow:0 0 15px;
}
