<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>😁 Photo Gallery 😁</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f4f4f4;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:30px;
}



.container{
    height: 100vh;
    display:grid;

    gap:20px;

    grid-template-areas:

    "box1 box1 box1"
    "box4 box5 box3 "
    "box4 box7 box8 "
    "box4 box7 box8"
    "box9 box9 box9";

}


.box{

    background:yellow;

    border-radius:10px;

}




.box1{
    grid-area:box1;
}

/*.box2{
    grid-area:box2;
}*/

.box3{
    grid-area:box3;
}

.box4{
    grid-area: box4;
}

.box5{
    grid-area:box5;
}

/*.box6{
    grid-area:box6;
}*/

.box7{
    grid-area:box7;
}

.box8{
    grid-area:box8;
}
.box9{
    grid-area:box9;
}
</style>

</head>


<body>


<h1>😁 Lets Bento 😁</h1>


<div class="container">
    <div class="box box1"></div>
    <!--div class="box box2"></div-->
    <div class="box box3"></div>
    <div class="box box4"></div>
    <div class="box box5"></div>
    <!--div class="box box6"></div-->
    <div class="box box7"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSv3XMxpdsJs5KPpqve8-J9tPNwUIhaIk1cowbvMuiK9A&s=10"></div>
    <div class="box box8"></div>
    <div class="box box9"></div>
    




</div>


</body>
</html>
