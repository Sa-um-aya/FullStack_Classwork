<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>😁 Photo Gallery 😁</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f4f4f4;
    padding:20px;
}

/* Desktop Layout */
.container{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;

    grid-template-areas:
        "box1 box2 box3"
        "box4 box5 box6"
        "box7 box8 box9";
}

.box{
    height:180px;
    border-radius:10px;
    background-color: magenta;
}

/* Assign grid areas */
.box1{grid-area:box1;}
.box2{grid-area:box2;}
.box3{grid-area:box3;}
.box4{grid-area:box4;}
.box5{grid-area:box5;}
.box6{grid-area:box6;}
.box7{grid-area:box7;}
.box8{grid-area:box8;}
.box9{grid-area:box9;}

/* Mobile Layout */
@media (max-width:500px){

.container{
    grid-template-columns:1fr;

    grid-template-areas:
        "box1"
        "box2"
        "box3"
        "box4"
        "box5"
        "box6"
        "box7"
        "box8"
        "box9";
}

}
</style>
<h1 style="text-align:center">😁PHOTO GALLERY😁</h1>
</head>
<body>

<div class="container">

    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
    <div class="box box5"></div>
    <div class="box box6"></div>
    <div class="box box7"></div>
    <div class="box box8"></div>
    <div class="box box9"></div>

</div>

</body>
</html>
